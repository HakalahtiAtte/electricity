[build]
  publish = "dist"
  command = "npm run build"

# Security headers for all routes
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self' https://api.spot-hinta.fi; img-src 'self' data:; font-src 'self'"

# CDN-level cache for the Fingrid function — serves cached response for 1 hour
# before invoking the function again, protecting the Fingrid API quota
[[headers]]
  for = "/.netlify/functions/fingrid"
  [headers.values]
    Cache-Control = "public, max-age=3600, s-maxage=3600"
